name: Apply review speed presets

on:
  push:
    paths:
      - '.github/workflows/speed-presets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply presets
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          def patch(path, pairs):
              p = pathlib.Path(path)
              s = p.read_text(encoding='utf-8')
              for old, new in pairs:
                  c = s.count(old)
                  if c != 1:
                      raise SystemExit('%s: expected 1 match, found %d for %r' % (path, c, old[:70]))
                  s = s.replace(old, new)
              p.write_text(s, encoding='utf-8')
              print('patched', path)
          patch('sf-review.js', [
          ("/* Per-position search budget for Game Review. Previous setting was 'depth 18 movetime 400'. */\nvar REVIEW_DEPTH=26;\nvar REVIEW_MS=2500;\nvar REVIEW_GO='depth '+REVIEW_DEPTH+' movetime '+REVIEW_MS;",
           "/* Per-position search budget for Game Review: the deep search is opt-in. */\nvar REVIEW_SPEEDS={\n  fast:{depth:18,ms:400,label:'fast'},\n  balanced:{depth:22,ms:1200,label:'balanced'},\n  deep:{depth:26,ms:2500,label:'deep'}\n};\nvar reviewSpeed='balanced';\nfunction budget(){return REVIEW_SPEEDS[reviewSpeed]||REVIEW_SPEEDS.balanced;}\nfunction reviewGo(){var s=budget();return 'depth '+s.depth+' movetime '+s.ms;}"),
          ("var review=null,graph=null,stopFlag=false,busy=false,originalRun=null;",
           "var review=null,graph=null,stopFlag=false,busy=false,originalRun=null,runSeq=0;"),
          ("function fallbackReview(){",
           "function abortUI(){\n  busy=false;\n  runSeq++;\n  SF.setRunning(false);\n  var runBtn=$('runReviewBtn'),stopBtn=$('stopReviewBtn'),t=$('engineLine');\n  if(runBtn){runBtn.disabled=false;}\n  if(stopBtn){stopBtn.classList.add('hidden');}\n  if(t){t.textContent='Review stopped.';}\n}\nfunction fallbackReview(){"),
          ("SF.search(fen,REVIEW_GO,SF.configureFull)",
           "SF.search(fen,reviewGo(),SF.configureFull)"),
          ("if(sum){sum.innerHTML='';sum.appendChild(el('div','muted','Deep review: Stockfish searches every move to depth '+REVIEW_DEPTH+' (up to '+(REVIEW_MS/1000).toFixed(1)+' s per position)",
           "var b0=budget();\n  if(sum){sum.innerHTML='';sum.appendChild(el('div','muted','Review ('+b0.label+'): Stockfish searches every move up to depth '+b0.depth+' ('+(b0.ms/1000).toFixed(1)+' s per position max)"),
          ("  busy=true;\n  SF.setRunning(true);",
           "  busy=true;\n  var myRun=++runSeq;\n  SF.setRunning(true);"),
          ("SF.startEngine().then(async function(){\n    var replay=new Orig();",
           "SF.startEngine().then(async function(){\n    if(myRun!==runSeq){return;}\n    if(lineEl){lineEl.textContent='Stockfish: searching position 1/'+(sans.length+1)+'…';}\n    var replay=new Orig();"),
          ("var first=await evalPos(replay.fen());\n    review={",
           "var first=await evalPos(replay.fen());\n    if(stopFlag){if(lineEl){lineEl.textContent='Review stopped.';}finishReview();return;}\n    review={"),
          ("after=await evalPos(replay.fen());\n      review.lines[i+1]=after;",
           "after=await evalPos(replay.fen());\n      if(myRun!==runSeq){return;}\n      if(stopFlag){break;}\n      review.lines[i+1]=after;"),
          ("' of '+REVIEW_DEPTH+' · '",
           "' of '+budget().depth+' · '"),
          ("}).catch(function(e){\n    busy=false;",
           "}).catch(function(e){\n    if(myRun!==runSeq){return;}\n    busy=false;"),
          ("function init(){\n  makeGraph();\n  var rb=$('runReviewBtn'),sb=$('stopReviewBtn'),ab=$('analyseBtn');",
           "function init(){\n  makeGraph();\n  var speedBtns=document.querySelectorAll('#speedSeg button');\n  function paintSpeed(){\n    for(var k=0;k<speedBtns.length;k++){\n      var btn=speedBtns[k];\n      if(btn.dataset.speed===reviewSpeed){btn.classList.add('active');}else{btn.classList.remove('active');}\n    }\n  }\n  function wireSpeed(i){\n    var btn=speedBtns[i];\n    if(!btn){return;}\n    btn.addEventListener('click',function(){\n      reviewSpeed=btn.dataset.speed||'balanced';\n      paintSpeed();\n      var l=$('engineLine');\n      if(l&&!busy){var s=budget();l.textContent='Review speed: '+s.label+' · up to depth '+s.depth+' · '+(s.ms/1000).toFixed(1)+' s per position';}\n    });\n  }\n  for(var wi=0;wi<speedBtns.length;wi++){wireSpeed(wi);}\n  paintSpeed();\n  var rb=$('runReviewBtn'),sb=$('stopReviewBtn'),ab=$('analyseBtn');"),
          ("if(sb){sb.onclick=null;sb.addEventListener('click',function(){stopFlag=true;if(SF.stop){SF.stop();}});}",
           "if(sb){sb.onclick=null;sb.addEventListener('click',function(){\n    stopFlag=true;\n    if(SF.stop){SF.stop();}\n    if(busy){abortUI();}\n  });}"),
          ])
          patch('index.html', [
          ("      <div class='muted' style='margin:6px 0'>Stockfish 19 · deep search to depth 26 · every move rated · accuracy + eval graph</div>",
           "      <div class='muted' style='margin:6px 0'>Stockfish 19 · every move rated · accuracy + eval graph</div>\n      <label class='lbl'>Review speed</label>\n      <div class='seg' id='speedSeg'>\n        <button data-speed='fast' title='~0.4 s per move'>⚡ Fast</button>\n        <button data-speed='balanced' class='active' title='~1.2 s per move'>⚖ Balanced</button>\n        <button data-speed='deep' title='~2.5 s per move'>🔍 Deep</button>\n      </div>"),
          ("        <li><b>Analysis:</b> hints search to depth 24; Game Review searches every move to depth 26 (2.5 s per position, slower on long games) and shows the depth it actually reached</li>",
           "        <li><b>Analysis:</b> hints search to depth 24; Game Review searches every move and shows the depth it reached — pick ⚡ Fast, ⚖ Balanced (default) or 🔍 Deep in the Analyse panel</li>"),
          ])
          PY
      - name: Commit
        run: |
          set -euo pipefail
          git rm -q .github/workflows/speed-presets.yml
          git -c user.name='uxp70' -c user.email='uxp70@users.noreply.github.com' commit -am 'Add fast/balanced/deep review speed presets to the Analyse panel'
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main
