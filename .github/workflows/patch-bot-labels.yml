name: Patch bot labels
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch app.js
        run: |
          cat > /tmp/patch.js <<'JS'
          const fs=require('fs');
          const {execSync}=require('child_process');
          const rep=[];
          const out=l=>{rep.push(l);console.log(l);};
          const labels={Sprout:'Stockfish Skill 0 · depth 1',Pixel:'Stockfish Skill 1 · depth 2',Mira:'Stockfish Skill 3 · depth 3',Jonah:'Stockfish Skill 6 · depth 5',Zara:'Stockfish UCI_Elo 1500 · depth 8',Odin:'Stockfish UCI_Elo 1850 · depth 12'};
          let s=fs.readFileSync('app.js','utf8');
          const lines=s.split('\n');
          let added=0,lab=0,sty=0;
          for(let i=0;i<lines.length;i++){
            const m=lines[i].match(/name:"([A-Za-z]+)"/);
            if(!m||!labels[m[1]])continue;
            if(lines[i].indexOf('elo:')<0){out('SKIP-NO-ELO '+m[1]+' :: '+lines[i]);continue;}
            if(lines[i].indexOf('sf:"')>=0){out('ALREADY '+m[1]);added++;continue;}
            const before=lines[i];
            lines[i]=lines[i].replace(/(depth:\d+,)/,'$1sf:"'+labels[m[1]]+'",');
            if(lines[i]===before){out('NO-INSERT '+m[1]+' :: '+before);continue;}
            added++;
            out('INSERTED '+m[1]);
          }
          for(let i=0;i<lines.length;i++){
            if(lines[i].indexOf('b.elo')>=0&&lines[i].indexOf('b.depth')>=0){
              out('LABEL-BEFORE :: '+lines[i]);
              lines[i]=lines[i].replace("' · depth '+b.depth+' · '","' · '+b.sf+' · '");
              out('LABEL-AFTER :: '+lines[i]);
              if(lines[i].indexOf('b.sf')>=0)lab++;
            }
          }
          let out_s=lines.join('\n');
          if(out_s.indexOf('Searches five plies and almost never errs.')>=0){
            out_s=out_s.replace('Searches five plies and almost never errs.','Searches to depth 12 and almost never errs.');
            sty++;
            out('STYLE-PATCHED');
          }
          fs.writeFileSync('/tmp/app.patched.js',out_s);
          let syn=false;
          try{execSync('node --check /tmp/app.patched.js');syn=true;out('SYNTAX OK');}catch(e){out('SYNTAX FAIL');}
          const done=added===6&&lab===1&&sty===1&&syn;
          out('ADDED '+added+' LABEL '+lab+' STYLE '+sty+' DONE '+done);
          fs.writeFileSync('patch-report.txt',rep.join('\n')+'\n');
          if(done){fs.copyFileSync('/tmp/app.patched.js','app.js');out('WROTE app.js');}
          else{out('LEFT app.js UNCHANGED');process.exit(1);}
          JS
          node /tmp/patch.js
      - name: Commit patch
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js patch-report.txt
          if git diff --cached --quiet; then echo 'nothing to commit'; exit 0; fi
          git commit -m 'fix(bots): show Stockfish strength in the bot list [skip ci]'
          git pull --rebase origin main
          git push
