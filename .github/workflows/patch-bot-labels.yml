name: Patch bot labels
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch app.js
        run: |
          cat > /tmp/patch.js <<'JS'
          const fs=require('fs');
          let s=fs.readFileSync('app.js','utf8');
          function must(re,rep,label){
            const n=(s.match(re)||[]).length;
            if(n!==1){console.error('EXPECTED 1 MATCH, GOT '+n+': '+label);process.exit(1);}
            s=s.replace(re,rep);
            console.log('ok '+label);
          }
          const bots=[
            ['Sprout',300,1,'Stockfish Skill 0 · depth 1'],
            ['Pixel',600,1,'Stockfish Skill 1 · depth 2'],
            ['Mira',900,2,'Stockfish Skill 3 · depth 3'],
            ['Jonah',1200,3,'Stockfish Skill 6 · depth 5'],
            ['Zara',1500,4,'Stockfish UCI_Elo 1500 · depth 8'],
            ['Odin',1850,5,'Stockfish UCI_Elo 1850 · depth 12']
          ];
          for(const b of bots){
            const head='{name:"'+b[0]+'",elo:'+b[1]+',avatar:"[^"]*",depth:'+b[2]+',';
            must(new RegExp(head),head+'sf:"'+b[3]+'",','sf field for '+b[0]);
          }
          must(/' · depth '\+b\.depth\+' · '/g,"' · '+b.sf+' · '",'bot list label');
          must(/Searches five plies and almost never errs\./g,'Searches to depth 12 and almost never errs.','Odin style text');
          fs.writeFileSync('app.js',s);
          console.log('patched app.js');
          JS
          node /tmp/patch.js
          node --check app.js
          grep -n 'sf:"' app.js
          grep -n 'b.sf' app.js
      - name: Commit patch
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js
          if git diff --cached --quiet; then echo 'nothing to commit'; exit 0; fi
          git commit -m 'fix(bots): show Stockfish strength in the bot list [skip ci]'
          git pull --rebase origin main
          git push
