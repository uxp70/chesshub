name: Move quality badges
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply badge patch
        run: |
          python3 - <<'PY'
          import pathlib
          def sub(path, old, new):
              p = pathlib.Path(path)
              s = p.read_text()
              n = s.count(old)
              assert n == 1, (path, n, old[:60])
              p.write_text(s.replace(old, new))

          sub('sf-core.js', "nm='abcdefgh'[c]+(8-r);", "nm='abcdefgh'[c]+(8-r);d.dataset.sq=nm;")

          old_review = """function renderReviewAt(p){
            if(!review){return;}
            p=Math.max(0,Math.min(review.classes.length,p));
            review.p=p;
            var g=new Orig(),i,line,status;
            for(i=0;i<p;i++){g.move(review.sans[i]);}
            SF.drawBoard(g);"""

          new_review = """function drawMoveBadge(sq,cls){
            if(!sq||!cls){return;}
            var b=$('board');
            if(!b){return;}
            var cell=b.querySelector('.sq[data-sq="'+sq+'"]');
            if(!cell){return;}
            var badge=el('span','mvbadge '+cls,TAGS[cls]||'');
            badge.title=cls+' move';
            badge.setAttribute('aria-label',cls+' move');
            cell.appendChild(badge);
          }
          function renderReviewAt(p){
            if(!review){return;}
            p=Math.max(0,Math.min(review.classes.length,p));
            review.p=p;
            var g=new Orig(),i,line,status,mv,lastTo=null;
            for(i=0;i<p;i++){mv=g.move(review.sans[i]);if(i===p-1&&mv){lastTo=mv.to;}}
            SF.drawBoard(g);
            drawMoveBadge(lastTo,p>0?review.classes[p-1]:null);"""

          sub('sf-review.js', old_review, new_review)

          css_anchor = ".sq.b .pc{color:#111;text-shadow:0 0 2px #fff,0 1px 1px rgba(255,255,255,.4)}"
          badge_css = css_anchor + """
          .sq .mvbadge{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;line-height:1;letter-spacing:-.5px;color:#fff;border:1.5px solid rgba(0,0,0,.35);box-shadow:0 1px 4px rgba(0,0,0,.5);pointer-events:none;z-index:3}
          .sq .mvbadge.Brilliant{background:#12b3b3}.sq .mvbadge.Great{background:#5b8fd9}.sq .mvbadge.Best{background:#9bc25a;color:#101510}
          .sq .mvbadge.Excellent{background:#7fa650}.sq .mvbadge.Good{background:#5f8f45}.sq .mvbadge.Book{background:#a98545;font-size:10px}
          .sq .mvbadge.Inaccuracy{background:#f0b429;color:#101510}.sq .mvbadge.Mistake{background:#e07020}.sq .mvbadge.Miss{background:#e03b3b}
          .sq .mvbadge.Blunder{background:#d32f2f}
          @media(max-width:420px){.sq .mvbadge{width:17px;height:17px;font-size:9px}}"""

          sub('styles.css', css_anchor, badge_css)
          sub('index.html', "href='./styles.css'", "href='./styles.css?v=badges'")
          print('patched ok')
          PY
          node --check sf-core.js
          node --check sf-review.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sf-core.js sf-review.js styles.css index.html
          git commit -m 'Show move quality badges on the review board'
          git pull --rebase origin main
          git push
      - name: Remove this workflow
        run: |
          SHA=$(curl -s -H "Authorization: token $GITHUB_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/.github/workflows/move-badges.yml?ref=main" | python3 -c "import sys,json;print(json.load(sys.stdin)['sha'])")
          sleep 3
          curl -s -X DELETE -H "Authorization: token $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/.github/workflows/move-badges.yml" \
            -d "{\"message\":\"Remove one-off badge workflow [skip ci]\",\"sha\":\"$SHA\",\"branch\":\"main\"}"
