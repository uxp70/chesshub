name: Remove duplicate Stockfish 10
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply asserted patches, commit and remove this workflow
        run: |
          cat > /tmp/patch.js <<'PATCH'
          const fs=require('fs');
          const root=process.cwd()+'/';
          function read(f){return fs.readFileSync(root+f,'utf8');}
          function write(f,s){fs.writeFileSync(root+f,s);}
          function cut(s,startMarker,endMarker,keepEnd){
            const i=s.indexOf(startMarker);
            if(i<0)throw new Error('start not found: '+startMarker.slice(0,60));
            if(s.indexOf(startMarker,i+1)>=0)throw new Error('start duplicated: '+startMarker.slice(0,60));
            const j=s.indexOf(endMarker,i);
            if(j<0)throw new Error('end not found: '+endMarker.slice(0,60));
            return s.slice(0,i)+(keepEnd?s.slice(j):'')+(keepEnd?'':s.slice(j+endMarker.length));
          }
          function rep(s,a,b){
            const n=s.split(a).length-1;
            if(n!==1)throw new Error('expected 1 match, got '+n+': '+a.slice(0,70));
            return s.replace(a,b);
          }
          
          let app=read('app.js');
          
          // 1. The Stockfish 10 worker, its UCI bridge and engineBest().
          app=cut(app,
            '/* ------------------------------------------------------------------ *\n *  Stockfish — real engine in a Web Worker',
            '/* --------------------------- move sounds --------------------------- */',
            true);
          
          // 2. The hint handler that used engineBest (sf-core.js installs the Stockfish 19 hint).
          app=cut(app,
            "$('hintBtn').onclick=()=>{",
            "$('analyseBtn').onclick",
            true);
          
          // 3. The old review implementation and its now-unused rendering helpers.
          app=cut(app,
            '/* ----------------------------- review ----------------------------- */',
            '/* --------------------------- tabs & setup -------------------------- */',
            true);
          
          // 4. Old review/speed button wiring (sf-review.js owns these controls now).
          app=cut(app,
            "$('analyseBtn').onclick=()=>{switchTab('Analyse');runReview();};",
            "$('pgnBtn').onclick",
            true);
          
          // 5. Keyboard shortcuts for the old review navigator.
          app=rep(app,
            "document.addEventListener('keydown',e=>{\n  if(e.key==='ArrowLeft'&&review)jumpToPly(review.pos);\n  if(e.key==='ArrowRight'&&review)jumpToPly(review.pos+2);\n});\n",
            "");
          
          // 6. switchTab no longer starts the second engine.
          app=rep(app, "function switchTab(which){\n  if(which==='Analyse')sfStart();\n", "function switchTab(which){\n");
          
          // 7. Remaining review-only state and rendering.
          app=rep(app, "let selected=null, legalCache=[], review=null, reviewIdx=0, showBest=true;", "let selected=null, legalCache=[];");
          app=rep(app, "  renderMoves();updateStatus();drawBestArrow();", "  renderMoves();updateStatus();");
          app=rep(app, "function currentEvalCp(){\n  if(review&&review.evalsByPly&&review.evalsByPly.length){\n    const p=review.pos+1;\n    if(typeof review.evalsByPly[p]==='number')return review.evalsByPly[p];\n  }\n  return evaluate(game);\n}", "function currentEvalCp(){return evaluate(game);}");
          app=rep(app, "  if(review&&review.pos<game.history().length-1)return;\n", "");
          app=rep(app, "  review=null;gameOver=false;resultShown=false;", "  gameOver=false;resultShown=false;");
          app=rep(app, "  game=new Chess();selected=null;legalCache=[];review=null;gameOver=false;resultShown=false;", "  game=new Chess();selected=null;legalCache=[];gameOver=false;resultShown=false;");
          app=rep(app, "  gameOver=false;resultShown=false;$('resultCard').classList.add('hidden');review=null;render();", "  gameOver=false;resultShown=false;$('resultCard').classList.add('hidden');render();");
          app=rep(app, "    game=g;review=null;gameOver=game.game_over();resultShown=false;render();switchTab('Analyse');", "    game=g;gameOver=game.game_over();resultShown=false;render();switchTab('Analyse');");
          app=rep(app, "    game=g;review=null;resultShown=false;render();", "    game=g;resultShown=false;render();");
          app=rep(app, "  if(b)b.onclick=()=>{switchTab('Analyse');runReview();};", "  if(b)b.onclick=()=>{const a=$('analyseBtn');if(a)a.click();};");
          
          // replace renderMoves with a plain list (tags were only drawn from the old review object)
          app=rep(app,
          "function renderMoves(){\n  moveListEl.innerHTML='';\n  const h=game.history();\n  const cls=review?review.classes:[];\n  for(let i=0;i<h.length;i+=2){\n    const li=document.createElement('li');\n    const tagFor=(j)=>{const c=cls[j];return c?' <span class=\"tag '+c.label+'\">'+c.icon+'</span>':'';};\n    let html=(i/2+1)+'. '+h[i]+tagFor(i);\n    if(h[i+1])html+=' &nbsp;'+h[i+1]+tagFor(i+1);\n    li.innerHTML=html;\n    if(reviewIdx===i||reviewIdx===i+1)li.classList.add('cur');\n    li.onclick=()=>{ if(review){reviewIdx=Math.min(i+1,h.length-1);jumpToPly(reviewIdx+1);} };\n    moveListEl.appendChild(li);\n  }\n  moveListEl.scrollTop=moveListEl.scrollHeight;\n}",
          "function renderMoves(){\n  moveListEl.innerHTML='';\n  const h=game.history();\n  for(let i=0;i<h.length;i+=2){\n    const li=document.createElement('li');\n    let html=(i/2+1)+'. '+h[i];\n    if(h[i+1])html+=' &nbsp;'+h[i+1];\n    li.innerHTML=html;\n    moveListEl.appendChild(li);\n  }\n  moveListEl.scrollTop=moveListEl.scrollHeight;\n}");
          
          // remove drawBestArrow (only the old review object fed it; sf-review draws its own arrow)
          app=cut(app,
            "function drawBestArrow(){\n",
            "/* ----------------------------- input ------------------------------ */",
            true);
          
          // sqXY only positioned the old review arrow.
          app=rep(app,"function sqXY(sq){\n  let f=sq.charCodeAt(0)-97,r=8-parseInt(sq[1],10);\n  if(orientation==='b'){f=7-f;r=7-r;}\n  return [f+0.5,r+0.5];\n}\n","");
          
          // leftover identifiers must be gone
          ['sfStart','sfAbort','engineBest','sfStatus','sfSend','sfGo','sfWaitReady','reviewing','runReview','jumpToPly','renderPosition','updateEngineLine','reviewBudget','reviewSpeed','CLS_ORDER','summaryHtml','classifyMove','sacrificeLikely','sameMove','accFromDrop','winPctWhite','winPctFor','kingSquareTmp','BOOK_SANS','drawBestArrow','showBest','reviewIdx','sqXY'].forEach(function(id){
            const re=new RegExp('\\b'+id+'\\b');
            const m=app.match(re);
            if(m)throw new Error('leftover identifier '+id+' at '+app.slice(Math.max(0,app.indexOf(m[0])-60),app.indexOf(m[0])+60));
          });
          if(/\breview\b/.test(app))throw new Error('leftover review reference: '+app.split('\n').map((l,i)=>/\breview\b/.test(l)?(i+1)+': '+l.trim():'').filter(Boolean).join(' | '));
          if(/sf10|Stockfish 10|cdnjs.cloudflare.com\/ajax\/libs\/stockfish/i.test(app))throw new Error('leftover Stockfish 10 reference');
          if(/new Worker|importScripts/.test(app))throw new Error('leftover worker creation');
          write('app.js',app);
          
          // sf-core.js: drop the fallback plumbing that called app.js's old hint handler.
          let core=read('sf-core.js');
          core=rep(core,"var whiteView=true,originalHint=null;","var whiteView=true;");
          core=cut(core,"function fallbackHint(ev){","function deepHint(ev){",true);
          core=rep(core,"  if(!g){fallbackHint(ev);return;}","  if(!g){return;}");
          core=rep(core,".catch(function(e){if(th){th.classList.add('hidden');}log('hint failed',e);fallbackHint(ev);});",".catch(function(e){if(th){th.classList.add('hidden');}log('hint failed',e);});");
          core=rep(core,"  if(hb){originalHint=hb.onclick;hb.onclick=null;hb.addEventListener('click',deepHint);}","  if(hb){hb.onclick=null;hb.addEventListener('click',deepHint);}");
          if(/originalHint|fallbackHint/.test(core))throw new Error('core leftovers');
          write('sf-core.js',core);
          
          // sf-review.js: drop the fallback that called app.js's old runReview.
          let rv=read('sf-review.js');
          rv=rep(rv,"var review=null,graph=null,stopFlag=false,busy=false,originalRun=null,runSeq=0;","var review=null,graph=null,stopFlag=false,busy=false,runSeq=0;");
          rv=cut(rv,"function fallbackReview(){","function runDeepReview(){",true);
          rv=rep(rv,"  if(!g){fallbackReview();return;}","  if(!g){return;}");
          rv=rep(rv,"    if(lineEl){lineEl.textContent='Stockfish unavailable: '+e.message;}\n    fallbackReview();","    if(lineEl){lineEl.textContent='Stockfish unavailable: '+e.message;}");
          rv=rep(rv,"  originalRun=rb?rb.onclick:null;\n","");
          if(/originalRun|fallbackReview/.test(rv))throw new Error('review leftovers');
          write('sf-review.js',rv);
          
          console.log('patched OK');
          PATCH
          node /tmp/patch.js
          git config user.name 'ChessHub bot'
          git config user.email 'bot@users.noreply.github.com'
          git rm --quiet .github/workflows/remove-sf10.yml
          git add app.js sf-core.js sf-review.js
          git commit -m 'Remove the duplicate Stockfish 10 engine and its dead code [skip ci]'
          git pull --rebase
          git push
